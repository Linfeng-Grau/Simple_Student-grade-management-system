# ============================================================
# 学生成绩管理系统 配置
# ============================================================

spring.application.name=score-web

# ---------- 端口 ----------
# 本机 8080 已被 VS Code 内嵌浏览器（CEF 调试端口）占用，这里改用 8081
server.port=8081

# ---------- 编码 ----------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ---------- JSP 视图 ----------
# JSP 放在 src/main/webapp/WEB-INF/jsp 下，只能由控制器转发访问，不能被浏览器直接打开
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ---------- 数据库（H2 文件模式） ----------
# 数据文件位于工程根目录 data/score-db.mv.db，重启后成绩不丢失；
# 想恢复成「每次启动都是干净数据」，把 ddl-auto 改成 create-drop 即可
spring.datasource.url=jdbc:h2:file:./data/score-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 控制台（开发调试用）：http://localhost:8081/h2-console
spring.h2.console.enabled=true
